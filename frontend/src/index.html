<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Portafolio de Francisco Santiago</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="Portafolio de Francisco Santiago: desarrollo frontend, Adobe Experience Manager y arquitecturas headless que escalan."
  />
  <meta name="theme-color" content="#123a5c" />

  <!-- Aplica el tema guardado antes del primer render (evita parpadeo) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('fs-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    })();
  </script>
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_MX" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Fuentes: Barlow, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <app-root></app-root>
</body>
</html>
